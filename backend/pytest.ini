[pytest]
# Constrain test discovery to the tests/ directory. Without this,
# pytest's default rootdir is the cwd, and it recurses into
# backend/data/remotes/<id>/backend/tests/ (copies of the project
# left behind by the remote-git cache), causing duplicate test
# collection and import-path collisions. CLAUDE.md only describes
# `cd backend && python3 -m pytest -q`; making testpaths explicit
# matches that documented command.
testpaths = tests
